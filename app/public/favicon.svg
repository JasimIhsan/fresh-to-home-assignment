<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C27B0" />
      <stop offset="50%" stop-color="#8E24AA" />
      <stop offset="100%" stop-color="#6A1B9A" />
    </linearGradient>

    <!-- Warm Accent Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#E53935" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <!-- Inner Graphics Group with Filter -->
  <g filter="url(#softShadow)" transform="translate(0, -6)">
    <!-- House Contour / Roofline -->
    <path 
      d="M256 120 L138 226 C131 232 133 244 142 244 H162 V372 C162 380 168 386 176 386 H336 C344 386 350 380 350 372 V244 H370 C379 244 381 232 374 226 L256 120 Z" 
      fill="#FFFFFF" 
      fill-opacity="0.12" 
    />
    <!-- Crisp Roof Arch -->
    <path 
      d="M256 124 L132 235 C124 242 129 256 140 256 H166 V368 C166 376 172 382 180 382 H332 C340 382 346 376 346 368 V256 H372 C383 256 388 242 380 235 L256 124 Z" 
      stroke="#FFFFFF" 
      stroke-width="20" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Chimney -->
    <path d="M190 180 V142 H220 V207" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Cloche Dome (Serving Platter) -->
    <path 
      d="M194 322 C194 278 221 242 256 242 C291 242 318 278 318 322 Z" 
      fill="#FFFFFF" 
    />
    <!-- Cloche Handle / Knob -->
    <ellipse cx="256" cy="235" rx="12" ry="7" fill="#FFFFFF" />

    <!-- Cloche Base Tray / Platter Rim -->
    <rect x="180" y="328" width="152" height="18" rx="9" fill="url(#coralGrad)" />

    <!-- Fresh Leaf Emblem sprouting from top -->
    <path 
      d="M256 226 C256 226 298 200 290 152 C268 150 240 184 256 226 Z" 
      fill="#81C784" 
    />
    <path 
      d="M256 226 C262 196 280 172 290 152" 
      stroke="#388E3C" 
      stroke-width="4" 
      stroke-linecap="round" 
    />

    <!-- Cleaver / Knife Accent Silhouette -->
    <path 
      d="M276 282 L332 324 C336 327 342 325 344 320 L348 310 C350 305 348 299 343 296 L298 266 Z" 
      fill="url(#coralGrad)" 
      opacity="0.95"
    />
  </g>
</svg>
